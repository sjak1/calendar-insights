<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BriefingIQ Voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f6f3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2d2d2d;
        }

        .container {
            background: #fdfcfa;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid #e8e6e2;
            max-width: 800px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: min(90vh, 760px);
        }

        .header {
            padding: 24px 30px;
            text-align: center;
            border-bottom: 1px solid #e8e6e2;
        }
        .header h1 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
        .header p { color: #6b6560; font-size: 13px; }
        .header a { color: #6b6560; }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 30px;
            font-size: 13px;
            color: #6b6560;
            border-bottom: 1px solid #e8e6e2;
            background: #f8f6f3;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #c4beb6; flex: none;
        }
        .dot.live { background: #4a9d6f; animation: pulse 1.6s ease-in-out infinite; }
        .dot.busy { background: #d19a4a; animation: pulse 0.9s ease-in-out infinite; }
        .dot.error { background: #c4564a; }
        @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

        .transcript {
            flex: 1;
            overflow-y: auto;
            padding: 24px 30px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .turn { display: flex; flex-direction: column; gap: 4px; max-width: 85%; }
        .turn.user { align-self: flex-end; align-items: flex-end; }
        .turn.assistant { align-self: flex-start; }
        .turn .who {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
            color: #a39d95;
        }
        .turn .text {
            padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 15px;
            white-space: pre-wrap; word-wrap: break-word;
        }
        .turn.user .text { background: #2d2d2d; color: #fdfcfa; }
        .turn.assistant .text { background: #f0ede8; color: #2d2d2d; }
        .turn.partial .text { opacity: 0.6; font-style: italic; }

        .backend {
            align-self: center; max-width: 92%;
            font-size: 12.5px; color: #6b6560;
            background: #f5f1ea; border: 1px solid #e8e6e2;
            border-left: 3px solid #d19a4a;
            padding: 10px 14px; border-radius: 8px;
            white-space: pre-wrap; word-wrap: break-word;
        }
        .backend.done { border-left-color: #4a9d6f; }
        .backend.failed { border-left-color: #c4564a; }
        .backend b { color: #2d2d2d; font-weight: 600; }

        .empty { margin: auto; text-align: center; color: #a39d95; font-size: 14px; line-height: 1.7; }

        .controls {
            padding: 18px 30px; border-top: 1px solid #e8e6e2;
            display: flex; gap: 12px; align-items: center;
        }
        button {
            border: none; border-radius: 12px; padding: 13px 22px;
            font-size: 15px; font-weight: 500; cursor: pointer;
            font-family: inherit; transition: opacity 0.15s;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        #startBtn { background: #2d2d2d; color: #fdfcfa; flex: 1; }
        #stopBtn { background: #f0ede8; color: #2d2d2d; border: 1px solid #e8e6e2; }
        audio { height: 34px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ BriefingIQ Voice</h1>
            <p>Ask about events out loud &middot; <a href="/">switch to text chat</a></p>
        </div>

        <div class="status">
            <span class="dot" id="dot"></span>
            <span id="statusText">Not connected</span>
        </div>

        <div class="transcript" id="transcript">
            <div class="empty" id="empty">
                Press <b>Start talking</b> and ask something.<br>
                &ldquo;What&rsquo;s on the agenda today?&rdquo; &middot; &ldquo;Who are the presenters?&rdquo;<br>
                &ldquo;What locations are available?&rdquo;
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">Start talking</button>
            <button id="stopBtn" disabled>End</button>
            <audio id="audio" autoplay controls></audio>
        </div>
    </div>

    <script>
    // ---------------------------------------------------------------------
    // GPT-Live 1 runs the conversation. It has no calendar data of its own, so
    // every real question comes back as a client delegation, which we answer by
    // calling the same /process_query endpoint the text chat uses.
    // ---------------------------------------------------------------------

    const transcriptEl = document.getElementById('transcript');
    const emptyEl = document.getElementById('empty');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('statusText');
    const dot = document.getElementById('dot');
    const audio = document.getElementById('audio');

    let peer, events, microphone, closeTimeout;
    let ready = false, finalized = false;

    // Share the session with the text chat so context carries across both UIs.
    function getSessionId() {
        let id = localStorage.getItem('chat_session_id');
        if (!id) {
            id = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('chat_session_id', id);
        }
        return id;
    }

    function setStatus(text, kind = '') {
        statusText.textContent = text;
        dot.className = 'dot' + (kind ? ' ' + kind : '');
    }

    // --- transcript rendering -------------------------------------------

    // Fragments arrive with no turn-completed event, so we group by speaker and
    // start a fresh bubble after a gap in the session timeline.
    const TURN_GAP_MS = 1500;
    const history = [];           // { role, text, start_ms, end_ms }
    let liveTurn = null;          // the bubble currently being appended to

    function appendDelta(role, delta, start_ms, end_ms) {
        if (emptyEl) emptyEl.remove();

        const continues = liveTurn
            && liveTurn.role === role
            && start_ms - liveTurn.end_ms < TURN_GAP_MS;

        if (!continues) {
            const el = document.createElement('div');
            el.className = 'turn ' + role + ' partial';
            el.innerHTML = '<div class="who">' + (role === 'user' ? 'You' : 'Assistant') + '</div>';
            const text = document.createElement('div');
            text.className = 'text';
            el.appendChild(text);
            transcriptEl.appendChild(el);
            liveTurn = { role, text: '', start_ms, end_ms, el, textEl: text };
            history.push(liveTurn);
        }

        liveTurn.text += delta;
        liveTurn.end_ms = end_ms;
        liveTurn.textEl.textContent = liveTurn.text;
        liveTurn.el.classList.remove('partial');
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function addBackendCard(label) {
        if (emptyEl && emptyEl.parentNode) emptyEl.remove();
        const el = document.createElement('div');
        el.className = 'backend';
        el.innerHTML = '<b>⚙ backend</b> · ' + label;
        transcriptEl.appendChild(el);
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
        return el;
    }

    // --- delegation ------------------------------------------------------

    let lastDelegationOffset = 0;

    // The delegation event carries metadata only, never the task text, so we
    // reconstruct the request from the transcript we have been keeping.
    function buildBackendQuery(offset_ms) {
        const fresh = history
            .filter(t => t.role === 'user' && t.end_ms > lastDelegationOffset)
            .map(t => t.text.trim())
            .filter(Boolean)
            .join(' ');

        // Short replies ("yes", "Thursday not Friday") need what came before.
        const context = history
            .slice(-6)
            .map(t => (t.role === 'user' ? 'User: ' : 'Assistant: ') + t.text.trim())
            .filter(l => l.length > 8)
            .join('\n');

        lastDelegationOffset = offset_ms;

        if (!fresh) return null;
        if (context && context.length > fresh.length + 20) {
            return 'Recent conversation:\n' + context + '\n\nAnswer the latest user request: ' + fresh;
        }
        return fresh;
    }

    function send(event) {
        if (events && events.readyState === 'open') events.send(JSON.stringify(event));
    }

    // Appends are limited to 500 tokens, and a long report is unlistenable anyway.
    // Trim on a sentence boundary and let the model offer the rest.
    const SPEECH_LIMIT = 1500;
    function forSpeech(text) {
        const clean = text.replace(/\*\*/g, '').replace(/^#+ /gm, '').trim();
        if (clean.length <= SPEECH_LIMIT) return clean;
        const cut = clean.slice(0, SPEECH_LIMIT);
        const stop = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('\n'));
        return (stop > 400 ? cut.slice(0, stop + 1) : cut)
            + '\n\n[Truncated. Summarize what is here and offer the full list on screen.]';
    }

    async function handleDelegation(delegationId, offset_ms) {
        const query = buildBackendQuery(offset_ms);
        if (!query) {
            send({
                type: 'session.commentary.append',
                event_id: 'nore_' + Date.now(),
                delegation_id: delegationId,
                content: "I didn't catch what to look up. Ask the user to repeat it."
            });
            return;
        }

        const card = addBackendCard('querying &mdash; <i>' + query.slice(-140) + '</i>');
        setStatus('Looking it up…', 'busy');

        // The pipeline takes ~20s. Quiet progress keeps the model from filling the
        // silence with invented detail; thinking.append is not spoken aloud.
        const keepalive = [6000, 14000].map(ms => setTimeout(() => send({
            type: 'session.thinking.append',
            event_id: 'wait_' + Date.now(),
            delegation_id: delegationId,
            content: 'The backend lookup is still running and has returned nothing yet. '
                + 'Do not answer from memory. If the user speaks, acknowledge briefly '
                + 'and say the lookup is still going.'
        }), ms));

        try {
            const res = await fetch('/process_query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, headers: {}, session_id: getSessionId() })
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            // /process_query returns either a plain string or an object that may
            // also carry a chart or a PDF. Only the text is speakable.
            let text;
            if (typeof data.message === 'string') text = data.message;
            else if (data.message && typeof data.message === 'object') {
                text = data.message.text || data.message.message || JSON.stringify(data.message);
            } else text = String(data.message);

            card.className = 'backend done';
            card.innerHTML = '<b>⚙ backend</b> · answered<br>' + text.slice(0, 400)
                + (text.length > 400 ? '…' : '');

            send({
                type: 'session.commentary.append',
                event_id: 'res_' + Date.now(),
                delegation_id: delegationId,
                content: forSpeech(text)
            });
        } catch (err) {
            card.className = 'backend failed';
            card.innerHTML = '<b>⚙ backend</b> · failed: ' + err.message;
            send({
                type: 'session.commentary.append',
                event_id: 'err_' + Date.now(),
                delegation_id: delegationId,
                content: 'The lookup failed: ' + err.message
                    + '. Tell the user briefly and offer to try again.'
            });
        } finally {
            keepalive.forEach(clearTimeout);
            if (ready) setStatus('Listening', 'live');
        }
    }

    // --- connection ------------------------------------------------------

    function cleanup() {
        clearTimeout(closeTimeout);
        microphone?.getTracks().forEach(t => t.stop());
        events?.close();
        peer?.close();
        audio.srcObject = null;
        ready = false;
        liveTurn = null;
        startBtn.disabled = false;
        stopBtn.disabled = true;
    }

    startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        finalized = false;
        setStatus('Connecting…', 'busy');

        try {
            const connection = new RTCPeerConnection();
            peer = connection;

            connection.addEventListener('track', (e) => {
                audio.srcObject = new MediaStream([e.track]);
                audio.play().catch(() => setStatus('Press play on the audio control to hear replies', 'busy'));
            });

            microphone = await navigator.mediaDevices.getUserMedia({ audio: true });
            for (const track of microphone.getAudioTracks()) connection.addTrack(track, microphone);

            // The data channel must exist before the offer is created.
            events = connection.createDataChannel('oai-events');
            events.addEventListener('message', ({ data }) => {
                const event = JSON.parse(data);
                switch (event.type) {
                    case 'session.started':
                        ready = true;
                        stopBtn.disabled = false;
                        setStatus('Listening', 'live');
                        break;
                    case 'session.input_transcript.delta':
                        appendDelta('user', event.delta, event.start_ms, event.end_ms);
                        break;
                    case 'session.output_transcript.delta':
                        appendDelta('assistant', event.delta, event.start_ms, event.end_ms);
                        break;
                    case 'session.delegation.created':
                        handleDelegation(event.delegation.id, event.offset_ms);
                        break;
                    case 'session.closed':
                        finalized = true;
                        setStatus('Ended · ' + (event.usage?.seconds ?? '?') + 's of voice');
                        cleanup();
                        break;
                    case 'error':
                        console.error('live error', event);
                        setStatus('Error: ' + (event.error?.message ?? 'unknown'), 'error');
                        break;
                    default:
                        console.debug(event);
                }
            });
            events.addEventListener('close', (e) => {
                if (e.target !== events) return;
                if (!finalized) { setStatus('Disconnected', 'error'); cleanup(); }
            });

            const offer = await connection.createOffer();
            await connection.setLocalDescription(offer);
            if (connection.iceGatheringState !== 'complete') {
                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        connection.removeEventListener('icegatheringstatechange', onState);
                        reject(new Error('Timed out gathering ICE candidates'));
                    }, 10000);
                    function onState() {
                        if (connection.iceGatheringState !== 'complete') return;
                        clearTimeout(timeout);
                        connection.removeEventListener('icegatheringstatechange', onState);
                        resolve();
                    }
                    connection.addEventListener('icegatheringstatechange', onState);
                    onState();
                });
            }

            const sdp = connection.localDescription?.sdp;
            if (!sdp) throw new Error('Missing local SDP offer');

            const res = await fetch('/live/session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sdp })
            });
            if (!res.ok) throw new Error((await res.json()).error || ('HTTP ' + res.status));
            const result = await res.json();

            await connection.setRemoteDescription({ type: 'answer', sdp: result.transport.sdp });
            setStatus('Negotiating…', 'busy');
            // The HTTP request started the session; never send session.start here.
        } catch (err) {
            setStatus(err.message, 'error');
            cleanup();
        }
    });

    stopBtn.addEventListener('click', () => {
        if (!ready || !events || events.readyState !== 'open') return;
        stopBtn.disabled = true;
        setStatus('Wrapping up…', 'busy');
        // session.closed carries the final usage, so wait for it before tearing down.
        send({ type: 'session.close' });
        closeTimeout = setTimeout(() => {
            setStatus('Ended without final usage', 'error');
            cleanup();
        }, 15000);
    });
    </script>
</body>
</html>
